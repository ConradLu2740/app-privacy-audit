name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests (21 tests: gates + rule engine)
        run: python -m pytest tests/ -v

      - name: Run engine eval set (6 cases, P/R/F1 + gate assertions)
        run: python evals/run_eval.py --report out/eval_report.md
